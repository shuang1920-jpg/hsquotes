<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>灵光 · 金句匣</title>
    <!-- 引入腾讯云开发 Web SDK -->
    <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.2/cloudbase.full.js"></script>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0d15;
            padding: 16px;
            background: radial-gradient(circle at 20% 20%, rgba(74, 0, 224, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 60%, rgba(255, 215, 0, 0.15) 0%, transparent 40%),
                        #0b0d15;
        }

        /* ===== 主容器 (毛玻璃) ===== */
        .glass-container {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 25, 45, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 42px;
            padding: 28px 20px 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 10%, rgba(100, 150, 255, 0.1), transparent 60%);
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .header .count-badge {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-area {
            position: relative;
            z-index: 2;
            margin-bottom: 24px;
        }
        .input-area textarea {
            width: 100%;
            height: 100px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 16px 18px;
            font-size: 16px;
            line-height: 1.6;
            color: #f1f5f9;
            resize: none;
            outline: none;
            transition: all 0.25s ease;
        }
        .input-area textarea:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .input-row input[type="date"] {
            flex: 1;
            min-width: 140px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #cbd5e1;
            outline: none;
            transition: 0.2s;
        }
        .input-row input[type="date"]:focus {
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }
        .input-row input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) brightness(0.9);
            cursor: pointer;
        }

        .btn-save {
            flex: 1;
            min-width: 80px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .btn-save:active {
            transform: scale(0.94);
        }
        .btn-save:disabled {
            opacity: 0.5;
            transform: none;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 12px 4px;
            position: relative;
            z-index: 2;
        }
        .list-header span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
            position: relative;
            z-index: 2;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .entries-list::-webkit-scrollbar {
            width: 3px;
        }
        .entries-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 16px 18px;
            transition: all 0.25s ease;
            animation: fadeSlideUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
        }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .entry-text {
            font-size: 16px;
            line-height: 1.6;
            color: #e2e8f0;
            word-break: break-word;
            margin-bottom: 10px;
            font-weight: 400;
        }
        .entry-text::before {
            content: '“';
            color: rgba(167, 139, 250, 0.4);
            font-size: 18px;
            font-weight: 700;
            margin-right: 4px;
        }
        .entry-text::after {
            content: '”';
            color: rgba(167, 139, 250, 0.4);
            font-size: 18px;
            font-weight: 700;
            margin-left: 4px;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .entry-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .entry-date::before {
            content: '📅';
            font-size: 12px;
            opacity: 0.5;
        }
        .entry-delete {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: 0.2s;
            line-height: 1;
        }
        .entry-delete:active {
            color: #f87171;
            background: rgba(239, 68, 68, 0.15);
        }
        .entry-delete.is-mine {
            color: rgba(255, 100, 100, 0.5);
        }
        .entry-delete.is-mine:active {
            color: #f87171;
            background: rgba(239, 68, 68, 0.2);
        }
        .entry-delete.not-mine {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        .empty-state {
            text-align: center;
            padding: 48px 0 32px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .empty-state span {
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading-tip {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
        }

        /* ===== 密码遮罩 ===== */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 20, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            padding: 30px;
            transition: opacity 0.5s ease;
        }
        #password-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 40px 28px 36px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }
        .lock-box .lock-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .lock-box h2 {
            color: #f1f5f9;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .lock-box p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .lock-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 16px 20px;
            font-size: 18px;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: 0.25s;
        }
        .lock-box input:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .lock-box input::placeholder {
            letter-spacing: 0px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
        }
        .lock-box .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-top: 14px;
            height: 20px;
            transition: 0.2s;
        }
        .lock-box .btn-unlock {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
        }
        .lock-box .btn-unlock:active {
            transform: scale(0.96);
        }

        .hidden {
            display: none !important;
        }
        .mt-1 { margin-top: 4px; }
    </style>
</head>
<body>

    <!-- ===== 密码遮罩 ===== -->
    <div id="password-overlay">
        <div class="lock-box">
            <span class="lock-icon">✨</span>
            <h2>灵光 · 金句匣</h2>
            <p>输入密码，开启灵感</p>
            <input type="password" id="password-input" placeholder="请输入访问密码" autocomplete="off">
            <div class="error-msg" id="password-error"></div>
            <button class="btn-unlock" id="unlock-btn">解 锁</button>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div class="glass-container" id="app-container">
        <div class="header">
            <h1>✦ 灵光匣</h1>
            <span class="count-badge" id="entry-count">0 条</span>
        </div>

        <div class="input-area">
            <textarea id="idea-input" placeholder="此刻的奇思妙想，或是打动你的金句…"></textarea>
            <div class="input-row">
                <input type="date" id="date-input">
                <button class="btn-save" id="save-btn">✦ 存入</button>
            </div>
            <div style="margin-top:8px;font-size:12px;color:rgba(255,255,255,0.2);text-align:right;" id="user-status">未连接</div>
        </div>

        <div class="list-header">
            <span>📖 灵感集</span>
        </div>

        <div class="entries-list" id="entries-list">
            <div class="loading-tip">⏳ 加载中...</div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. 密码校验
            // ============================================================
            const CORRECT_PASSWORD = 'bravohs666';
            const overlay = document.getElementById('password-overlay');
            const passwordInput = document.getElementById('password-input');
            const unlockBtn = document.getElementById('unlock-btn');
            const errorMsg = document.getElementById('password-error');

            function unlockApp() {
                overlay.classList.add('hidden');
                sessionStorage.setItem('isUnlocked', 'true');
                // 解锁后初始化云开发
                initCloudBase();
            }

            function handleUnlock() {
                const pwd = passwordInput.value.trim();
                if (pwd === CORRECT_PASSWORD) {
                    errorMsg.textContent = '';
                    unlockApp();
                } else {
                    errorMsg.textContent = '❌ 密码错误，请重试';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            unlockBtn.addEventListener('click', handleUnlock);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleUnlock();
                }
            });

            if (sessionStorage.getItem('isUnlocked') === 'true') {
                overlay.classList.add('hidden');
                // 但此时云开发尚未初始化，需要等页面加载完成后调用
                // 我们会在页面加载完成后检查并初始化
            } else {
                overlay.classList.remove('hidden');
                passwordInput.focus();
            }

            // ============================================================
            // 2. 腾讯云开发核心逻辑
            // ============================================================
            const ENV_ID = 'hsquotes-d0goazq5j27ffa856';
            const COLLECTION_NAME = 'ideas';

            let app = null;
            let db = null;
            let currentUser = null; // 存储当前匿名用户的 openid
            let isCloudReady = false;

            // DOM 元素
            const ideaInput = document.getElementById('idea-input');
            const dateInput = document.getElementById('date-input');
            const saveBtn = document.getElementById('save-btn');
            const entriesList = document.getElementById('entries-list');
            const countBadge = document.getElementById('entry-count');
            const userStatus = document.getElementById('user-status');

            // 辅助：日期默认今天
            function setDefaultDate() {
                const today = new Date();
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const d = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${y}-${m}-${d}`;
            }
            setDefaultDate();

            // 初始化云开发
            function initCloudBase() {
                if (isCloudReady) return;
                try {
                    app = cloudbase.init({
                        env: ENV_ID
                    });
                    // 匿名登录
                    const auth = app.auth({ persistence: 'local' });
                    auth.anonymousAuthProvider().signIn().then(() => {
                        // 获取当前用户信息
                        currentUser = auth.currentUser;
                        if (currentUser) {
                            // 从 currentUser.uid 获取 openid (腾讯云匿名登录的 uid 就是 openid)
                            const openid = currentUser.uid;
                            console.log('匿名登录成功，openid:', openid);
                            userStatus.textContent = '✅ 已连接 (匿名)';
                            db = app.database();
                            isCloudReady = true;
                            // 加载数据
                            loadEntries();
                        } else {
                            userStatus.textContent = '❌ 登录失败';
                        }
                    }).catch(err => {
                        console.error('匿名登录失败:', err);
                        userStatus.textContent = '❌ 登录失败，请检查网络或控制台匿名登录是否开启';
                    });
                } catch (e) {
                    console.error('初始化云开发失败:', e);
                    userStatus.textContent = '❌ 初始化失败';
                }
            }

            // 如果页面加载时已经解锁，直接初始化
            if (sessionStorage.getItem('isUnlocked') === 'true') {
                // 等DOM完全加载
                if (document.readyState === 'complete') {
                    initCloudBase();
                } else {
                    window.addEventListener('load', initCloudBase);
                }
            } else {
                // 未解锁，等待解锁按钮触发
            }

            // ============================================================
            // 3. 数据库操作
            // ============================================================

            // 加载所有灵感（按日期降序）
            function loadEntries() {
                if (!db) return;
                const collection = db.collection(COLLECTION_NAME);
                // 按 date 降序，然后按 _id 降序（保证最新在前）
                collection.orderBy('date', 'desc').orderBy('_id', 'desc').get().then(res => {
                    const data = res.data || [];
                    renderEntries(data);
                }).catch(err => {
                    console.error('查询失败:', err);
                    entriesList.innerHTML = `<div class="empty-state"><span>⚠️</span>加载失败，请重试</div>`;
                });
            }

            // 渲染列表
            function renderEntries(entries) {
                countBadge.textContent = `${entries.length} 条`;

                if (entries.length === 0) {
                    entriesList.innerHTML = `
                        <div class="empty-state">
                            <span>🪐</span>
                            还没有灵感，写一条吧
                        </div>
                    `;
                    return;
                }

                let html = '';
                entries.forEach(entry => {
                    const parts = entry.date.split('-');
                    const displayDate = `${parts[0]}年${parts[1]}月${parts[2]}日`;
                    const safeText = entry.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    // 判断是否本人（通过 _openid 对比）
                    const isMine = (entry._openid === currentUser?.uid);
                    const deleteClass = isMine ? 'is-mine' : 'not-mine';
                    const deleteTitle = isMine ? '删除' : '仅可删除自己的';
                    html += `
                        <div class="entry-card" data-id="${entry._id}">
                            <div class="entry-text">${safeText}</div>
                            <div class="entry-footer">
                                <span class="entry-date">${displayDate}</span>
                                <button class="entry-delete ${deleteClass}" data-id="${entry._id}" title="${deleteTitle}" ${isMine ? '' : 'disabled'}>✕</button>
                            </div>
                        </div>
                    `;
                });

                entriesList.innerHTML = html;

                // 绑定删除事件（仅本人可删）
                entriesList.querySelectorAll('.entry-delete.is-mine').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');
                        if (confirm('确定要删除这条灵感吗？')) {
                            deleteEntryById(id);
                        }
                    });
                });
            }

            // 添加新灵感
            function addEntry() {
                if (!isCloudReady) {
                    alert('云服务未就绪，请稍后');
                    return;
                }
                const text = ideaInput.value.trim();
                const date = dateInput.value;
                if (!text) {
                    ideaInput.style.borderColor = '#f87171';
                    setTimeout(() => ideaInput.style.borderColor = '', 600);
                    return;
                }
                if (!date) {
                    alert('请选择日期');
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.textContent = '⏳ 存入中';

                const collection = db.collection(COLLECTION_NAME);
                collection.add({
                    text: text,
                    date: date,
                    // 系统会自动添加 _openid 字段（当前用户的匿名ID）
                }).then(res => {
                    // 成功
                    ideaInput.value = '';
                    setDefaultDate();
                    loadEntries(); // 刷新列表
                }).catch(err => {
                    console.error('添加失败:', err);
                    alert('添加失败，请重试');
                }).finally(() => {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '✦ 存入';
                });
            }

            // 删除单条（仅本人可删，但后端已校验，此处前端只允许自己的按钮）
            function deleteEntryById(id) {
                if (!db) return;
                const collection = db.collection(COLLECTION_NAME);
                // 注意：权限为“读取全部，修改本人”，所以只有 _openid 匹配的文档才能被删除
                collection.doc(id).remove().then(() => {
                    loadEntries();
                }).catch(err => {
                    console.error('删除失败:', err);
                    alert('删除失败，可能您没有权限');
                });
            }

            // ============================================================
            // 4. 绑定UI事件
            // ============================================================
            saveBtn.addEventListener('click', addEntry);
            ideaInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    addEntry();
                }
            });

            // 如果云开发已经准备就绪，也可以手动刷新
            // 暴露 reload 到控制台方便调试
            window.reloadEntries = loadEntries;

        })();
    </script>
</body>
</html>
